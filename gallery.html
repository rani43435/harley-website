<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harley · Gallery</title>
<meta name="description" content="Videos and pictures of Harley, the AI companion for Meta Quest 3 and 3S.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a fixed WebGL stage with Harley; editorial type scrolls over it, and she flies to each chapter. */
  --ink:#0d0a16;
  --ink-2:#171226;
  --paper:#f0ecf8;
  --lav:#c9b8ff;
  --violet:#8a5cff;
  --muted:#9a92ad;
  --line:rgba(201,184,255,.16);
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --gut:clamp(18px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--lav);outline-offset:4px;border-radius:6px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
body.light-zone{color:var(--ink)}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px var(--gut);color:var(--paper);transition:color .4s}
body.light-zone .bar{color:var(--ink)}
.bar.scrolled{background:rgba(13,10,22,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.light-zone .bar.scrolled{background:rgba(240,236,248,.6)}
.logo{font-family:var(--display);font-weight:600;letter-spacing:.02em;text-decoration:none;font-size:18px;display:flex;gap:10px;align-items:center}
.logo i{width:10px;height:10px;border-radius:50%;background:#fff;display:inline-block;box-shadow:0 0 14px var(--violet);background:currentColor}
.bar nav{display:flex;gap:28px;font-size:14px}
.bar nav a{text-decoration:none;opacity:.85}
.bar nav a:hover{opacity:1}
.menu-btn{display:none;appearance:none;border:0;background:rgba(201,184,255,.12);color:inherit;width:44px;height:44px;border-radius:50%;cursor:pointer;place-items:center}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:18px;height:1.6px;background:currentColor;border-radius:2px;position:relative;transition:transform .3s,opacity .3s}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0}
.menu-btn span::before{top:-6px}.menu-btn span::after{top:6px}
.bar.open .menu-btn span{background:transparent}
.bar.open .menu-btn span::before{transform:translateY(6px) rotate(45deg)}
.bar.open .menu-btn span::after{transform:translateY(-6px) rotate(-45deg)}
@media (max-width:760px){
  .menu-btn{display:grid}
  .bar nav{position:fixed;top:72px;right:var(--gut);flex-direction:column;gap:4px;padding:10px;border-radius:20px;background:rgba(23,18,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);color:var(--paper);min-width:210px;opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .25s,transform .25s}
  .bar nav a{padding:13px 14px;border-radius:12px;font-size:16px}
  .bar nav a:active{background:rgba(201,184,255,.12)}
  .bar.open nav{opacity:1;transform:none;pointer-events:auto}
}

.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lav)}
.btn{appearance:none;border:0;cursor:pointer;font:600 15px/1 var(--body);padding:17px 24px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.btn:hover{transform:translateY(-2px)}
.btn-main{background:var(--paper);color:var(--ink)}
.btn-ghost{background:rgba(201,184,255,.1);color:var(--paper);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(10px)}
.btn svg{width:18px;height:18px}
.bar{background:rgba(13,10,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar nav a[aria-current]{opacity:1;color:var(--lav)}
main{padding:120px var(--gut) 40px;max-width:1440px;margin:0 auto}
.glow{position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(50% 60% at 60% 30%,rgba(138,92,255,.22),transparent 70%);pointer-events:none;z-index:0}
h1{font-family:var(--display);font-weight:300;font-size:clamp(56px,11vw,170px);line-height:.88;letter-spacing:-.05em;margin:18px 0 22px}
.lead{max-width:44ch;color:#d9d2ea;font-size:clamp(17px,1.6vw,20px);margin:0 0 9vh}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.6vw,52px);letter-spacing:-.03em;line-height:1;margin:0 0 28px;display:flex;align-items:baseline;gap:18px}
h2 small{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--lav);font-weight:400}
section{border-top:1px solid var(--line);padding:7vh 0}
.trailer{position:relative;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:var(--ink-2);box-shadow:0 40px 120px rgba(138,92,255,.18),inset 0 0 0 1px var(--line)}
.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vids{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.vid{margin:0}
.vid video{width:100%;display:block;border-radius:22px;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.vid.tall video{aspect-ratio:9/16;object-fit:cover}
.vid figcaption,.shot figcaption{font-size:14px;color:var(--muted);margin-top:12px}
.vid figcaption b{color:var(--paper);font-weight:600;display:block;font-size:16px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.shot{margin:0;cursor:zoom-in}
.shot img{width:100%;height:auto;display:block;border-radius:20px;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;box-shadow:inset 0 0 0 1px var(--line)}
.shot:hover img{transform:translateY(-4px);box-shadow:0 30px 80px rgba(138,92,255,.25)}
.shot:first-child{grid-column:1 / -1}
.foot{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:28px;margin-top:6vh;font-size:14px;color:var(--muted)}
#lb{position:fixed;inset:0;z-index:20;background:rgba(8,6,14,.94);display:none;align-items:center;justify-content:center;padding:4vw}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:84vh;border-radius:14px}
#lb p{position:absolute;bottom:3vh;left:0;right:0;text-align:center;color:#d9d2ea;margin:0;font-size:15px}
#lb button{position:absolute;appearance:none;border:0;background:rgba(201,184,255,.12);color:var(--paper);width:52px;height:52px;border-radius:50%;cursor:pointer;font:400 22px/1 var(--body)}
#lb .x{top:20px;right:20px}#lb .pv{left:20px;top:50%;margin-top:-26px}#lb .nx{right:20px;top:50%;margin-top:-26px}
@media (max-width:900px){.vids{grid-template-columns:1fr 1fr}.vids .wide{grid-column:1 / -1}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.trailer{border-radius:16px}main{padding-top:100px}}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pics.two{grid-template-columns:1.6fr 1fr;margin:20px 0}
.pic.full{grid-column:1 / -1}
.stack{display:grid;gap:20px}
.pic figcaption{font-size:14px;color:var(--muted);margin-top:12px}
.pic{margin:0}.pic img{width:100%;height:auto;display:block;border-radius:22px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:620px){.pics{grid-template-columns:1fr}}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.feat{margin:0}.feat video{width:100%;display:block;border-radius:22px;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);aspect-ratio:3/2}
.feat figcaption{font-size:14px;color:var(--muted);margin-top:12px}
@media (max-width:760px){.feats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="bar">
  <a class="logo" href="./"><i></i>Harley</a>
  <nav>
    <a href="./#talk">What she does</a>
    <a href="./#ar">In your room</a>
    <a href="./#claude">Claude Code</a>
    <a href="gallery.html" aria-current="page">Gallery</a>
    <a class="keep" href="./#get">Get Harley</a>
  </nav>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button>
</header>
<main>
  <div class="kicker">Gallery</div>
  <h1>See Harley</h1>
  <p class="lead">The trailer and short films of Harley on Meta Quest 3 and 3S.</p>

  <section>
    <h2>What she does <small>6 FEATURES</small></h2>
    <div class="feats">
      <figure class="feat"><video src="media/feat_learn.mp4" poster="media/feat_learn_poster.jpg" autoplay muted loop playsinline preload="metadata"></video><figcaption>Learn a language</figcaption></figure>
      <figure class="feat"><video src="media/feat_sees.mp4" poster="media/feat_sees_poster.jpg" autoplay muted loop playsinline preload="metadata"></video><figcaption>She sees what you see</figcaption></figure>
      <figure class="feat"><video src="media/feat_live.mp4" poster="media/feat_live_poster.jpg" autoplay muted loop playsinline preload="metadata"></video><figcaption>Live answers</figcaption></figure>
      <figure class="feat"><video src="media/feat_computer.mp4" poster="media/feat_computer_poster.jpg" autoplay muted loop playsinline preload="metadata"></video><figcaption>Works on your computer</figcaption></figure>
      <figure class="feat"><video src="media/feat_memory.mp4" poster="media/feat_memory_poster.jpg" autoplay muted loop playsinline preload="metadata"></video><figcaption>Remembers you</figcaption></figure>
      <figure class="feat"><video src="media/feat_apps.mp4" poster="media/feat_apps_poster.jpg" autoplay muted loop playsinline preload="metadata"></video><figcaption>Apps and watching together</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>Trailer <small>2 MIN</small></h2>
    <div class="trailer"><iframe src="https://www.youtube-nocookie.com/embed/q0BjbkqBHI8?rel=0" title="Harley trailer" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </section>

  <section>
    <h2>Short films <small>2 VIDEOS</small></h2>
    <div class="vids">
      <figure class="vid wide"><video src="media/ad.mp4" poster="media/ad_poster.jpg" controls playsinline preload="none"></video><figcaption><b>Meet Harley</b>A 25 second ad.</figcaption></figure>
      <figure class="vid tall"><video src="media/reel.mp4" poster="media/reel_poster.jpg" controls playsinline preload="none"></video><figcaption><b>Reel</b>15 seconds.</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>Pictures <small>4 SHOTS</small></h2>
    <div class="pics">
      <figure class="pic full"><img src="media/01_cover.jpg" alt="Harley, your AI companion for Meta Quest 3 and 3S" loading="lazy" width="1500" height="1000"><figcaption>Harley, your AI companion for Meta Quest 3 and 3S</figcaption></figure>
    </div>
    <div class="pics two">
      <div class="stack">
        <figure class="pic"><img src="media/hey_harley.jpg" alt="Just say Hey Harley" loading="lazy" width="1500" height="1000"></figure>
        <figure class="pic"><video src="media/hologram.mp4" poster="media/hologram_poster.jpg" autoplay muted loop playsinline preload="metadata" style="width:100%;display:block;border-radius:22px;aspect-ratio:3/2;background:#0d0a16"></video></figure>
      </div>
      <figure class="pic"><img src="media/reel_thumb.jpg" alt="Harley, AI companion in mixed reality" loading="lazy"></figure>
    </div>
  </section>

  <div class="foot"><span>© 2026 Marjy Studios</span><a class="btn btn-main" href="./#get">Get Harley</a></div>
</main>

<script>
{const bar=document.querySelector('.bar'),b=document.getElementById('menuBtn');
 b.addEventListener('click',()=>{const o=bar.classList.toggle('open');b.setAttribute('aria-expanded',o);});}
/* one video at a time */
const vids=[...document.querySelectorAll('video[controls]')];
vids.forEach(v=>v.addEventListener('play',()=>vids.forEach(o=>{if(o!==v)o.pause();})));
</script>
</body>
</html>
